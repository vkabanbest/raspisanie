<!-- APP_VERSION: 7 -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Расписание</title>
<style>
:root{
  --bg:#f4f5fb;
  --card:rgba(255,255,255,.92);
  --text:#17181c;
  --muted:#777b87;
  --line:#e9e9ef;
  --blue:#5b5ce2;
  --purple:#8b5cf6;
  --green:#20b86b;
  --orange:#f59e0b;
  --shadow:0 12px 35px rgba(35,35,70,.09);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 100% 0%, rgba(139,92,246,.16), transparent 30%),
    radial-gradient(circle at 0% 18%, rgba(91,92,226,.12), transparent 28%),
    var(--bg);
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{max-width:760px;margin:auto;padding-bottom:28px}

header{
  padding:22px 3px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
h1{
  font-size:34px;
  line-height:1;
  letter-spacing:-1.4px;
  margin:0;
  font-weight:800;
}
.sub{
  font-size:14px;
  color:var(--muted);
  margin-top:7px;
  font-weight:550;
}
.iconbtn{
  width:44px;height:44px;border-radius:15px;border:1px solid rgba(255,255,255,.75);
  background:rgba(255,255,255,.72);
  color:var(--blue);
  font-size:20px;
  box-shadow:0 7px 20px rgba(35,35,70,.09);
  backdrop-filter:blur(18px);
}

.days{
  display:flex;gap:8px;overflow-x:auto;padding:2px 0 15px;
  scrollbar-width:none;
}
.days::-webkit-scrollbar{display:none}
.day{
  min-width:53px;
  border:0;
  border-radius:17px;
  background:rgba(255,255,255,.48);
  padding:9px 8px 8px;
  color:#747783;
  font-weight:700;
  transition:.2s ease;
}
.day b{display:block;font-size:16px;color:inherit}
.day small{display:block;font-size:9px;line-height:12px;margin-top:2px;min-height:12px}
.day.active{
  background:#1d1e25;
  color:#fff;
  box-shadow:0 8px 18px rgba(20,20,30,.18);
  transform:translateY(-1px);
}
.day.today:not(.active) b{color:var(--blue)}
.day.today:not(.active){box-shadow:inset 0 0 0 1.5px rgba(91,92,226,.18)}

.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#6566eb 0%,#8a5cf6 55%,#a56cf5 100%);
  color:white;
  border-radius:28px;
  padding:21px 20px 19px;
  margin-bottom:14px;
  box-shadow:0 16px 34px rgba(91,92,226,.24);
}
.hero:before,.hero:after{
  content:"";position:absolute;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.11);
}
.hero:before{width:150px;height:150px;right:-48px;top:-62px}
.hero:after{width:90px;height:90px;right:45px;bottom:-55px}
.hero>*{position:relative;z-index:1}
.hero .label{
  font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;
  opacity:.78;
}
.hero h2{font-size:25px;line-height:1.15;margin:7px 0 5px;letter-spacing:-.5px}
.hero .time{font-size:15px;color:rgba(255,255,255,.88);font-weight:550}
.progress{
  height:6px;background:rgba(255,255,255,.25);border-radius:10px;margin-top:16px;overflow:hidden
}
.progress i{display:block;height:100%;width:58%;background:#fff;border-radius:10px}
.hero:has(.time){}

.section{
  font-size:11px;color:#8a8d98;font-weight:800;text-transform:uppercase;
  letter-spacing:.7px;margin:18px 5px 8px;
}
.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.85);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
}
.item{
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:11px;
  padding:15px 14px;
  border-bottom:1px solid var(--line);
  align-items:center;
  transition:background .2s ease;
}
.item:last-child{border:0}
.item.current{
  background:linear-gradient(90deg,rgba(32,184,107,.10),rgba(32,184,107,.025));
  box-shadow:inset 4px 0 var(--green);
}
.item.done{opacity:.46}
.time{
  font-size:10.5px;color:#888c98;font-weight:800;line-height:1.4;
}
.title{font-size:16px;font-weight:720;letter-spacing:-.15px}
.meta{font-size:12px;color:#8a8d98;margin-top:4px}
.badge{
  font-size:9px;font-weight:800;padding:6px 8px;border-radius:9px;
  white-space:nowrap;
}
.gym{background:#e4e7ff;color:#5557c9}
.smart{background:#ddf7e9;color:#15945a}
.private{background:#fff0d9;color:#bc7610}
.other{background:#ededf2;color:#70727b}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-weight:550}

.actions{display:flex;gap:8px;margin:11px 0}
.actions button{
  flex:1;border:0;background:rgba(255,255,255,.78);border-radius:15px;padding:11px;
  font-weight:700;color:var(--blue);box-shadow:0 5px 16px rgba(35,35,70,.06);
  border:1px solid rgba(255,255,255,.8);
}
.install{display:none}

@media(min-width:600px){
  body{padding-left:24px;padding-right:24px}
  .item{padding:16px}
  .days{justify-content:center}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111216;--card:rgba(29,30,36,.92);--text:#f5f5f7;--muted:#989aa5;--line:#33343c}
  body{
    background:
      radial-gradient(circle at 100% 0%, rgba(139,92,246,.18), transparent 30%),
      radial-gradient(circle at 0% 18%, rgba(91,92,226,.15), transparent 28%),
      #111216;
  }
  .iconbtn,.actions button,.day{background:rgba(38,39,47,.75);color:#d7d8df}
  .day.active{background:#f5f5f7;color:#15161a}
  .day.today:not(.active) b{color:#8d8fff}
  .card{border-color:rgba(255,255,255,.06)}
  .gym{background:#292b55;color:#b9baff}
  .smart{background:#193b2a;color:#78dfab}
  .private{background:#49361c;color:#ffd28a}
  .other{background:#2b2c32;color:#b9bac2}
}
</style>
</head>
<body><div class="app">
<header><div><h1 id="title">Расписание</h1><div class="sub" id="subtitle"></div></div><button class="iconbtn" id="today" aria-label="Сегодня">⌁</button></header>
<nav class="days" id="days"></nav>
<section class="hero" id="hero"></section>
<div class="actions"><button id="edit">✏️ Заметка</button></div>
<div id="content"></div>
</div>
<script>
const names=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"],keys=["mon","tue","wed","thu","fri","sat","sun"];
const data={
mon:{school:"Smart School",type:"smart",items:[["","09:00–11:00","Ресепшн"],["4","12:00–12:40","Урок (5/6м, 1 г)"],["5","12:50–13:30","Урок (5/6м, 2 г)"],["6","13:50–14:30","Урок (6с/7, 1 г)"],["7","14:40–15:20","Урок (6с/7, 2 г)"],["","15:30–17:00","Сампо (7 кл)"],["","16:00–17:00","Прогулка"],["","17:00–19:00","Индивидуальные занятия"]]},
tue:{school:"Шаховская гимназия",type:"gym",items:[["1","08:30–09:10","Урок"],["2","09:20–10:00","Урок"],["3","10:10–10:50","Урок"],["4","11:00–11:40","Урок"],["5","11:55–12:35","Урок"],["6","12:50–13:30","Урок"],["","16:00","Частное: Полина"],["","17:00","Частное: Соня"],["","18:00","Частное: Максим"]]},
wed:{school:"Шаховская гимназия",type:"gym",items:[["1","08:30–09:10","Урок"],["2","09:20–10:00","Урок"],["3","10:10–10:50","Урок"],["4","11:00–11:40","Урок"],["5","11:55–12:35","Урок"],["6","12:50–13:30","Урок"],["","17:00","Частное: Женя"],["","19:00","Частное: Максим"]]},
thu:{school:"Шаховская гимназия",type:"gym",items:[["1","08:30–09:10","Урок"],["2","09:20–10:00","Урок"],["3","10:10–10:50","Урок"],["4","11:00–11:40","Урок"],["5","11:55–12:35","Урок"],["6","12:50–13:30","Урок"],["7","13:40–14:20","Урок"],["","15:00","Частное: Полина"]]},
fri:{school:"Smart School",type:"smart",items:[["1","09:30–10:10","Урок (5/6м, 1 г)"],["2","10:20–11:00","Урок (5/6м, 2 г)"],["3","11:10–11:50","Урок (6с/7, 1 г)"],["4","12:00–12:40","Урок (6с/7, 2 г)"],["","12:40–16:10","Ресепшн"],["","16:10","Прогулка"],["","17:00–18:00","Индивидуальные занятия"]]},
sat:{school:"Свободный день",type:"other",items:[]},sun:{school:"Свободный день",type:"other",items:[["","11:00","Соня"],["","12:00","Частное: Женя"]]}
};
let selected=keys[(new Date().getDay()+6)%7], notes=JSON.parse(localStorage.getItem("pwa-notes")||"{}");
function mins(s){let m=s.match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
function nowState(item){let p=item[1].split("–"),a=mins(p[0]),b=mins(p[1]||p[0]);if(a==null)return 0;let n=new Date().getHours()*60+new Date().getMinutes();return n>=a&&n<b?1:n>=b?2:0}
function todayKey(){return keys[(new Date().getDay()+6)%7]}
function renderDays(){days.innerHTML="";keys.forEach((k,i)=>{let b=document.createElement("button");b.className="day "+(k===selected?"active ":"")+(k===todayKey()?"today":"");b.innerHTML=`<b>${names[i]}</b><small>${k===todayKey()?"сегодня":""}</small>`;b.onclick=()=>{selected=k;render()};days.appendChild(b)})}
function renderHero(d){let cur=d.items.find(x=>nowState(x)===1);if(!cur){hero.innerHTML=`<div class="label">${d.school}</div><h2>${d.items.length?"Расписание на день":"Свободный день"}</h2><div class="time">${d.items.length?"Выбери занятие ниже":"Можно отдыхать 🙂"}</div>`;return}{
  let p=cur[1].split("–"), a=mins(p[0]), b=mins(p[1]||p[0]), n=new Date().getHours()*60+new Date().getMinutes();
  let pct=(b>a)?Math.max(0,Math.min(100,(n-a)/(b-a)*100)):0;
  hero.innerHTML=`<div class="label">Сейчас · ${d.school}</div><h2>${cur[2]}</h2><div class="time">${cur[1]}${cur[0]?` · урок ${cur[0]}`:""}</div><div class="progress"><i style="width:${pct}%"></i></div>`;
}}
function render(){renderDays();let d=data[selected];subtitle.textContent=selected===todayKey()?"Сегодня":names[keys.indexOf(selected)];renderHero(d);let html=`<div class="section">${d.school}</div><div class="card">`;if(!d.items.length)html+=`<div class="empty">На этот день ничего не запланировано</div>`;d.items.forEach(x=>{let st=nowState(x), badge=(x[2].includes("Частное")||x[2].includes("Индивидуальные занятия"))?"private":d.type;html+=`<div class="item ${st===1?"current":""} ${st===2?"done":""}"><div class="time">${x[0]?`УРОК ${x[0]}<br>`:""}${x[1]}</div><div><div class="title">${x[2]}</div>${(x[2].includes("Частное")||x[2].includes("Индивидуальные занятия"))?`<div class="meta">У меня дома</div>`:""}</div><span class="badge ${badge}">${(x[2].includes("Частное")||x[2].includes("Индивидуальные занятия"))?"Частное":d.type==="gym"?"Гимназия":d.type==="smart"?"Smart School":"Дело"}</span></div>`});html+="</div>";if(notes[selected])html+=`<div class="section">Заметка</div><div class="card"><div class="item"><div></div><div class="title">${notes[selected].replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div></div></div>`;content.innerHTML=html}
today.onclick=()=>{selected=todayKey();render()};edit.onclick=()=>{let v=prompt("Заметка для "+names[keys.indexOf(selected)],notes[selected]||"");if(v!==null){notes[selected]=v.trim();localStorage.setItem("pwa-notes",JSON.stringify(notes));render()}};

if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
render();setInterval(render,30000);
</script></body></html>
