<style id="animations-v29">

    });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloaded)return;
    reloaded=true;
    location.reload();
  });
}
render(false);setInterval(()=>{renderHero(selectedDate);if(document.visibilityState==="visible")renderDays()},30000);
</script>
