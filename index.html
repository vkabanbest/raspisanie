<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Расписание</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--blue:#007aff;--green:#34c759;--line:#e5e5ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);min-height:100vh}.app{max-width:760px;margin:auto}
header{padding:18px 3px 12px;display:flex;justify-content:space-between;align-items:flex-end}h1{font-size:32px;letter-spacing:-1px;margin:0}.sub{font-size:14px;color:var(--muted);margin-top:3px}.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:#fff;font-size:19px;box-shadow:0 2px 8px #0001}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{min-width:48px;border:0;border-radius:15px;background:transparent;padding:9px 7px;color:#6e6e73;font-weight:650}.day b{display:block;font-size:17px;color:inherit}.day small{font-size:10px}.day.active{background:#fff;color:#000;box-shadow:0 2px 9px #0002}.day.today b{color:var(--blue)}
.hero{background:#fff;border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 3px 14px #0000000d}.hero .label{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.6px}.hero h2{font-size:24px;margin:5px 0}.hero .time{font-size:16px;color:#6e6e73}.progress{height:5px;background:#e5e5ea;border-radius:5px;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:5px}
.section{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:17px 5px 7px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px #0000000a}.item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:14px;border-bottom:1px solid var(--line);align-items:center}.item:last-child{border:0}.time{font-size:11px;color:var(--muted);font-weight:700;line-height:1.35}.title{font-size:16px;font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{font-size:10px;font-weight:700;padding:6px 7px;border-radius:8px}.gym{background:#dcecff}.smart{background:#d9f7e5}.private{background:#fff0dc}.other{background:#eeeef3}.current{box-shadow:inset 4px 0 var(--green)}.done{opacity:.5}.empty{padding:35px 20px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:8px;margin:12px 0}.actions button{flex:1;border:0;background:#fff;border-radius:14px;padding:11px;font-weight:650;color:var(--blue)}.install{display:none}
@media(min-width:600px){body{padding-left:24px;padding-right:24px}.item{padding:16px}.days{justify-content:center}}
</style>
</head>
<body><div class="app">
<header><div><h1 id="title">Расписание</h1><div class="sub" id="subtitle"></div></div><button class="iconbtn" id="today">⌖</button></header>
<nav class="days" id="days"></nav>
<section class="hero" id="hero"></section>
<div class="actions"><button id="edit">✏️ Заметка</button></div>
<div id="content"></div>
</div>
<script>
const names=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"],keys=["mon","tue","wed","thu","fri","sat","sun"];
const data={
mon:{school:"Smart School",type:"smart",items:[["","09:00–11:00","Ресепшн"],["4","12:00–12:40","Урок (5/6м, 1 г)"],["5","12:50–13:30","Урок (5/6м, 2 г)"],["6","13:50–14:30","Урок (6с/7, 1 г)"],["7","14:40–15:20","Урок (6с/7, 2 г)"],["","15:30–17:00","Сампо (7 кл)"],["","16:00–17:00","Прогулка"],["","17:00–19:00","Индивидуальные занятия"]]},
tue:{school:"Шаховская гимназия",type:"gym",items:[["1","08:30–09:10","Урок"],["2","09:20–10:00","Урок"],["3","10:10–10:50","Урок"],["4","11:00–11:40","Урок"],["5","11:55–12:35","Урок"],["6","12:50–13:30","Урок"],["","16:00","Частное: Полина · у меня дома"],["","17:00","Частное: Соня · у меня дома"],["","18:00","Частное: Максим · у меня дома"]]},
wed:{school:"Шаховская гимназия",type:"gym",items:[["1","08:30–09:10","Урок"],["2","09:20–10:00","Урок"],["3","10:10–10:50","Урок"],["4","11:00–11:40","Урок"],["5","11:55–12:35","Урок"],["6","12:50–13:30","Урок"],["","17:00","Частное: Женя · у меня дома"],["","19:00","Частное: Максим · у меня дома"]]},
thu:{school:"Шаховская гимназия",type:"gym",items:[["1","08:30–09:10","Урок"],["2","09:20–10:00","Урок"],["3","10:10–10:50","Урок"],["4","11:00–11:40","Урок"],["5","11:55–12:35","Урок"],["6","12:50–13:30","Урок"],["7","13:40–14:20","Урок"],["","15:00","Частное: Полина · у меня дома"]]},
fri:{school:"Smart School",type:"smart",items:[["1","09:30–10:10","Урок (5/6м, 1 г)"],["2","10:20–11:00","Урок (5/6м, 2 г)"],["3","11:10–11:50","Урок (6с/7, 1 г)"],["4","12:00–12:40","Урок (6с/7, 2 г)"],["","12:40–16:10","Ресепшн"],["","16:10","Прогулка"],["","17:00–18:00","Индивидуальные занятия"]]},
sat:{school:"Свободный день",type:"other",items:[]},sun:{school:"Свободный день",type:"other",items:[["","11:00","Соня"],["","12:00","Частное: Женя · у меня дома"]]}
};
let selected=keys[(new Date().getDay()+6)%7], notes=JSON.parse(localStorage.getItem("pwa-notes")||"{}");
function mins(s){let m=s.match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
function nowState(item){let p=item[1].split("–"),a=mins(p[0]),b=mins(p[1]||p[0]);if(a==null)return 0;let n=new Date().getHours()*60+new Date().getMinutes();return n>=a&&n<b?1:n>=b?2:0}
function todayKey(){return keys[(new Date().getDay()+6)%7]}
function renderDays(){days.innerHTML="";keys.forEach((k,i)=>{let b=document.createElement("button");b.className="day "+(k===selected?"active ":"")+(k===todayKey()?"today":"");b.innerHTML=`<b>${names[i]}</b><small>${k===todayKey()?"сегодня":""}</small>`;b.onclick=()=>{selected=k;render()};days.appendChild(b)})}
function renderHero(d){let cur=d.items.find(x=>nowState(x)===1);if(!cur){hero.innerHTML=`<div class="label">${d.school}</div><h2>${d.items.length?"Расписание на день":"Свободный день"}</h2><div class="time">${d.items.length?"Выбери занятие ниже":"Можно отдыхать 🙂"}</div>`;return}hero.innerHTML=`<div class="label">Сейчас · ${d.school}</div><h2>${cur[2]}</h2><div class="time">${cur[1]} · урок ${cur[0]}</div><div class="progress"><i></i></div>`}
function render(){renderDays();let d=data[selected];subtitle.textContent=selected===todayKey()?"Сегодня":names[keys.indexOf(selected)];renderHero(d);let html=`<div class="section">${d.school}</div><div class="card">`;if(!d.items.length)html+=`<div class="empty">На этот день ничего не запланировано</div>`;d.items.forEach(x=>{let st=nowState(x), badge=(x[2].includes("Частное")||x[2].includes("Индивидуальные занятия"))?"private":d.type;html+=`<div class="item ${st===1?"current":""} ${st===2?"done":""}"><div class="time">${x[0]?`УРОК ${x[0]}<br>`:""}${x[1]}</div><div><div class="title">${x[2]}</div>${(x[2].includes("Частное")||x[2].includes("Индивидуальные занятия"))?`<div class="meta">У меня дома</div>`:""}</div><span class="badge ${badge}">${(x[2].includes("Частное")||x[2].includes("Индивидуальные занятия"))?"Частное":d.type==="gym"?"Гимназия":d.type==="smart"?"Smart School":"Дело"}</span></div>`});html+="</div>";if(notes[selected])html+=`<div class="section">Заметка</div><div class="card"><div class="item"><div></div><div class="title">${notes[selected].replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div></div></div>`;content.innerHTML=html}
today.onclick=()=>{selected=todayKey();render()};edit.onclick=()=>{let v=prompt("Заметка для "+names[keys.indexOf(selected)],notes[selected]||"");if(v!==null){notes[selected]=v.trim();localStorage.setItem("pwa-notes",JSON.stringify(notes));render()}};

if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
render();setInterval(render,30000);
</script></body></html>
